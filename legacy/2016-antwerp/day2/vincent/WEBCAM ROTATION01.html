<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Webcam BW Rotating</title>
    <style>
        body {
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            overflow: hidden;
            background: black;
        }
        
        #c {
            position: absolute;
            width: 100%;
            height: 100%;
            opacity: 1;
            -webkit-filter: blur(0.25px) saturate(0) brightness(1.2) invert(1) contrast(5.0);
            mix-blend-mode: difference;
        }
    </style>
</head>

<body>
    <canvas id="c"></canvas>

    <script src="canvas-utils.js"></script>
    <script>
        var canvas = document.querySelector('#c');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
        var ctx = canvas.getContext('2d');

        var mouseX = 0;
        var mouseY = 0;
        var rotation = 0;

        function onMouseMove(e) {
            mouseX = e.clientX;
            mouseY = e.clientY;
        }

        function onFrame(video) {
            ctx.save();
            ctx.translate(canvas.width / 2, canvas.height / 2);
            ctx.rotate(rotation);

            ctx.drawImage(video, 0, 0, video.width, video.height, 0, 0, canvas.width, canvas.height);
            rotation += 1.5;
            ctx.restore();
        }

        window.addEventListener('mousemove', onMouseMove);
        loadVideo(onFrame);
    </script>
</body>

</html>
