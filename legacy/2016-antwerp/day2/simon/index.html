<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Document</title>

    <style>
        html, body {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        body {
            color: #000000;
            animation-name: change;
            animation-duration: 20s;
            background: #000000;
            
        }
        
        @-webkit-keyframes mymove {
            0%, 100% {               
                left:20%;
                top:20%;
            }
            25% {
                left:80%;
                top:0%;
            }
            50% {
                left:40%;
                top:60%;
            }
            750% {
                left:60%;
                top:60%;
            }
            
            75% {
                left:20%;
                top:80%;
            }
            100% {
                left:40%;
                top:80%;
            }
            100% {
                left:40%;
                top:40%;
            }
            80% {
                left:20%;
                top:20%;
            }
            60% {
                left:0%;
                top:0%;
            }
                    }
        }
        
        @-webkit-keyframes change {
            from {
                color: #ffffff;
            }
            to {
                color: black;
            }
        }
        
        .mover {
            transition: all 1s;
            position: absolute;
            animation-name: mymove;
            animation-iteration-count: infinite;
        }
        
        .hidden {
            opacity: 1;
            transform: scale(0);
            -webkit-transform: scale(0);
        }
        
        #m1 {
            left: 100px;
            animation-duration: 3s;
            animation-delay: 3s;
        }
        
        #m2 {
            left: 200px;
            animation-duration: 6s;
        }
        
        #m3 {
            left: 300px;
            animation-duration: 9s;
        }
        
        #m4 {
            left: 400px;
            animation-name: mymove;
            animation-duration: 12s;
        }
        
        #m5 {
            left: 500px;
            animation-name: mymove;
            animation-duration: 14s;
        }
    </style>
</head>


<body>


    <video class="mover" id="m1" src="army-of-me.mp4" autoplay></video>
    <video class="mover" id="m2" src="army-of-me.mp4" autoplay></video>
    <video class="mover" id="m3" src="army-of-me.mp4" autoplay></video>
    <video class="mover" id="m4" src="army-of-me.mp4" autoplay></video>
    <video class="mover" id="m5" src="army-of-me.mp4" autoplay></video>


    <script>
        function hideMover() {
            this.classList.add('hidden');
        }

        var movers = document.querySelectorAll('.mover');

        for (var i = 0; i < movers.length; i++) {
            movers[i].addEventListener('click', hideMover);
        }
    </script>
</body>

</html>
