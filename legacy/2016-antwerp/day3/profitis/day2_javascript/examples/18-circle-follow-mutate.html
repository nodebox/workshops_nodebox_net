<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Randomness</title>
  <style>
  body {
    margin: 0;
    padding: 0;
    overflow: hidden;
  }
  </style>
</head>
<body>
<canvas id="c"></canvas>
<script src="canvas-utils.js"></script>
<script>
  var canvas = document.querySelector('#c');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  var ctx = canvas.getContext('2d');

  ctx.strokeStyle = 'black';
  ctx.lineWidth = 0.1;

  var centerX = canvas.width / 2;
  var centerY = canvas.height / 2;
  var circleSize = 200;
  var stepSize = 0;


  function draw() {
    Math.seedrandom(42);

    if (mouseX > 0) {
      centerX += (mouseX - centerX) * 0.01;
      centerY += (mouseY - centerY) * 0.01;
    }

    ctx.beginPath();
    for (var r = 0; r < Math.PI * 2; r += 0.1) {
      var dx = Math.random() * stepSize;
      var dy = Math.random() * stepSize;
      var x = centerX + Math.sin(r) * circleSize + dx;
      var y = centerY + Math.cos(r) * circleSize + dy;
      if (r === 0) {
        ctx.moveTo(x, y);
      } else {
        ctx.lineTo(x, y);
      }
    }
    ctx.closePath();
    ctx.stroke();

    stepSize += 0.05;

    window.requestAnimationFrame(draw);
  }

  draw();
</script>
</body>
</html>
