<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Drawing Order</title>
</head>
<body>
<canvas id="c" style="border: 1px solid black"></canvas>
<script>
  var canvas = document.querySelector('#c');
  var ctx = canvas.getContext('2d');
  ctx.fillStyle = 'blue';
  ctx.fillRect(10, 20, 30, 40);

  ctx.fillStyle = 'red';
  ctx.fillRect(20, 30, 30, 40);

  ctx.fillStyle = 'green';
  ctx.fillRect(30, 40, 30, 40);
</script>

</body>
</html>
