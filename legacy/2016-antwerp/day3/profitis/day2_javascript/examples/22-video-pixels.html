<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video Pixels</title>
  <style>
  body {
    margin: 0;
    padding: 0;
    overflow: hidden;
  }

  canvas {
    width: 100%;
    height: 100%;
    image-rendering: pixelated;
  }
  </style>
</head>
<body>
<canvas id="c" width="320" height="240"></canvas>

<script src="canvas-utils.js"></script>
<script>
  var canvas = document.querySelector('#c');
  var ctx = canvas.getContext('2d');

  function onFrame(video) {
    ctx.drawImage(video, 0, 0, 640, 480, 0, 0, 320, 240);
    var pixels = ctx.getImageData(0, 0, 320, 240);
    sortPixels(pixels, 'hue');
    ctx.putImageData(pixels, 0, 0);
  }

  loadVideo(onFrame);
</script>
</body>
</html>
