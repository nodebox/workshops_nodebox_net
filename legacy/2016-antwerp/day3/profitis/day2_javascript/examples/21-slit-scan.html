<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video</title>
  <style>
  body {
    margin: 0;
    padding: 0;
    overflow: hidden;
    background: black;
  }
  </style>
</head>
<body>
<canvas id="c"></canvas>

<script src="canvas-utils.js"></script>
<script>
  var canvas = document.querySelector('#c');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  var ctx = canvas.getContext('2d');

  var posX = 0;
  var slitWidth = 5;

  function onFrame(video) {
    ctx.drawImage(video, 320, 0, 1, 360, posX, 0, slitWidth, 720);
    posX += slitWidth;
    if (posX >= canvas.width) {
      posX = 0;
    }
  }

  loadVideo(onFrame);
</script>
</body>
</html>
