<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Video</title>
  <style>
  body {
    margin: 0;
    padding: 0;
    overflow: hidden;
  }
  </style>
</head>
<body>
<canvas id="c"></canvas>

<script src="canvas-utils.js"></script>
<script>
  var canvas = document.querySelector('#c');
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
  var ctx = canvas.getContext('2d');

  function onFrame(video) {
    ctx.drawImage(video, 0, 0);
  }

  loadVideo(onFrame);
</script>
</body>
</html>
