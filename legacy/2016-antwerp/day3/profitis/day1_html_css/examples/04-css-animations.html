<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Step 4</title>
  <style>
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #666;
    }

    body {
      font: 14px helvetica,arial,sans-serif;
      background: #333333;
      margin: 0;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    p {
      color: white;
      animation-name: move;
      animation-duration: 4s;
      animation-iteration-count: infinite;
    }

    @keyframes move {
      0%,100% {color: white;font-size: 14px;}
      50% {color: red;font-size: 300px;transform:rotate(180deg);}
    }

  </style>
</head>
<body>

<p>Hello</p>

</body>
</html>
