<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Step 3</title>
  <style>
    html, body {
      background: black;
      width: 100%;
      height: 100%;
      overflow: hidden;
      margin: 0;
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
    }

    video {
      animation: hue-rotate 10s infinite;
      float: left;
      width: 300px;
    }

    @keyframes hue-rotate {
      0% {
        -webkit-filter: hue-rotate(0deg);
        filter: hue-rotate(0deg);
      }
      100% {
        -webkit-filter: hue-rotate(360deg);
        filter: hue-rotate(360deg);
      }
    }
  </style>
</head>
<body>
  <video src="media/army-of-me.mp4" video autoplay style="animation-delay: 0s"></video>
  <video src="media/army-of-me.mp4" video autoplay style="animation-delay: 1s"></video>
  <video src="media/army-of-me.mp4" video autoplay style="animation-delay: 2s"></video>
  <video src="media/army-of-me.mp4" video autoplay style="animation-delay: 3s"></video>
  <video src="media/army-of-me.mp4" video autoplay style="animation-delay: 4s"></video>
  <video src="media/army-of-me.mp4" video autoplay style="animation-delay: 5s"></video>
  <video src="media/army-of-me.mp4" video autoplay style="animation-delay: 6s"></video>
  <video src="media/army-of-me.mp4" video autoplay style="animation-delay: 7s"></video>
  <video src="media/army-of-me.mp4" video autoplay style="animation-delay: 8s"></video>
  <video src="media/army-of-me.mp4" video autoplay style="animation-delay: 9s"></video>
  <video src="media/army-of-me.mp4" video autoplay style="animation-delay: 10s"></video>
  <video src="media/army-of-me.mp4" video autoplay style="animation-delay: 11s"></video>
</body>
</html>
