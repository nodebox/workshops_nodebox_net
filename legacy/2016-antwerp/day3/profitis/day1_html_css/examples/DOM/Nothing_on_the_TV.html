<!DOCTYPE html>
<html>

<head>
	<style>
		@keyframes lines {
			from {
				background: repeating-linear-gradient(red, black 5%)
			}
			to {
				background: repeating-linear-gradient(black, white 20%, black 10%)
			}
		}
		#grad1 {
			height: 70px;
			background: white;
			animation-name: lines;
			animation-duration: .23s;
			animation-iteration-count: infinite;
		}
	</style>
</head>

<body>
	<input type="range" min="0.1" max="0.3" value="0.23" step="0.01" onchange="change()">

	<div id="grad1" style="animation-delay: 0s"></div>
	<div id="grad1" style="animation-delay: 0.2s"></div>
	<div id="grad1" style="animation-delay: 0.4s"></div>
	<div id="grad1" style="animation-delay: 0.6s"></div>
	<div id="grad1" style="animation-delay: 0.8s"></div>
	<div id="grad1" style="animation-delay: 1.0s"></div>
	<div id="grad1" style="animation-delay: 1.2s"></div>
	<div id="grad1" style="animation-delay: 1.4s"></div>
	<div id="grad1" style="animation-delay: 1.6s"></div>
	<div id="grad1" style="animation-delay: 1.8s"></div>
	<script>
		function change() {
			var slider = document.querySelector("input");
			console.log(slider.value);
			var lines = document.querySelectorAll("#grad1");
			for (var i = 0; i < lines.length; i++) {
				var line = lines[i];
				line.style.animationDuration = slider.value + "s";
			}
		}
	</script>
</body>

</html>
