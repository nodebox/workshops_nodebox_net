<script>

function playVideoAtRandomInterval(video) {
  setTimeout(function() {video.play() }, 1000 + Math.random() * 15000);
}

window.onload = function() {
  var videos = document.getElementsByTagName('video');
  for (var i = 0; i < videos.length; i++) {
    playVideoAtRandomInterval(videos[i]);
  }
};
