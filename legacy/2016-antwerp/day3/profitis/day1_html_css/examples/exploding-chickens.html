<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Chickens</title>
  <style>
    html, body {
      background: black;
      width: 100%;
      height: 100%;
      overflow: hidden;
      margin: 0;
    }

    img {
      animation: rotator 5s infinite;
      width: 25%;
      float: left;
    }

    @keyframes rotator {
      0% {
        transform: rotateY(0deg);
      }

      100% {
        transform: rotateY(360deg);
      }
    }

  </style>
</head>
<body>

  <img src="media/chicken.jpg" alt="Chicken" style="animation-delay: 0ms">
  <img src="media/chicken.jpg" alt="Chicken" style="animation-delay: 100ms">
  <img src="media/chicken.jpg" alt="Chicken" style="animation-delay: 200ms">
  <img src="media/chicken.jpg" alt="Chicken" style="animation-delay: 300ms">
  <img src="media/chicken.jpg" alt="Chicken" style="animation-delay: 400ms">
  <img src="media/chicken.jpg" alt="Chicken" style="animation-delay: 500ms">
  <img src="media/chicken.jpg" alt="Chicken" style="animation-delay: 600ms">
  <img src="media/chicken.jpg" alt="Chicken" style="animation-delay: 700ms">
  <img src="media/chicken.jpg" alt="Chicken" style="animation-delay: 800ms">
  <img src="media/chicken.jpg" alt="Chicken" style="animation-delay: 900ms">
  <img src="media/chicken.jpg" alt="Chicken" style="animation-delay: 1000ms">
  <img src="media/chicken.jpg" alt="Chicken" style="animation-delay: 1100ms">
  <img src="media/chicken.jpg" alt="Chicken" style="animation-delay: 1200ms">
  <img src="media/chicken.jpg" alt="Chicken" style="animation-delay: 1300ms">
  <img src="media/chicken.jpg" alt="Chicken" style="animation-delay: 1400ms">
  <img src="media/chicken.jpg" alt="Chicken" style="animation-delay: 1500ms">
  <img src="media/chicken.jpg" alt="Chicken" style="animation-delay: 1600ms">
  <img src="media/chicken.jpg" alt="Chicken" style="animation-delay: 1700ms">
</body>
</html>
