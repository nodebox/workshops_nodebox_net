<!--
var ShockMode = 0;
// check for the plugin
if (navigator.mimeTypes && navigator.mimeTypes["application/x-director"] && navigator.mimeTypes["application/x-director"].enabledPlugin) 
{
		// check the plugin description to get the version string.
		if (navigator.plugins && navigator.plugins["Shockwave for Director"] && (versionIndex = navigator.plugins["Shockwave for Director"].description.indexOf(".")) != - 1) 
		{
				// parse the version string to get the plugin version. we're ok if the major version is 8 or higher
				var versionString = navigator.plugins["Shockwave for Director"].description.substring(versionIndex-1, versionIndex);
				var subVersionString = navigator.plugins["Shockwave for Director"].description.substring(versionIndex+1, versionIndex+2);
				versionIndex = parseInt( versionString );
				subVersionIndex = parseInt(subVersionString);
				if ( versionIndex = 8 ) {
					if (subVersionIndex >= 5)
							ShockMode = 1;
				}
				else if (versionIndex > 8 ) {
					ShockMode = 1;
				}
		}
}
// If we have detected a valid version of the plugin, write the Embed tag, otherwise, write the Image tag.
if ( ShockMode ) {
	document.write('<EMBED SRC="boom2.dcr"');
	document.write(' bgColor=#000000  WIDTH=512 HEIGHT=364 swStretchStyle=fill ');
	document.write('swRemote="');
	document.write("swSaveEnabled='true' swVolume='true' swRestart='true' swPausePlay='true' swFastForward='true' swContextMenu='true' ");
	document.write('"');
	document.write(' TYPE="application/x-director" PLUGINSPAGE="http://www.macromedia.com/shockwave/download/index.cgi?P1_Prod_Version=ShockwaveDirector">');
	document.write('</EMBED>');
} else if (!(navigator.appName && navigator.appName.indexOf("Netscape")>=0 && navigator.appVersion.indexOf("2.")>=0)){
	document.write('<IMG SRC="boom2.jpg" WIDTH=512 HEIGHT=364 BORDER=0>');
}
//-->
